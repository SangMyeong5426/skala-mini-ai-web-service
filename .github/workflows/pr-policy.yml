name: PR Policy

# 브랜치 이름과 PR 제목만 검사한다. 커밋을 더 올려도 결과 자체는 바뀌지 않지만,
# synchronize 를 빼면 안 된다 — 이 검사가 브랜치 보호의 **필수 상태 검사**라서다.
#
# 필수 검사는 PR 의 HEAD 커밋에 결과가 붙어 있어야 통과로 친다. synchronize 가
# 없으면 커밋을 하나 더 올린 순간 새 HEAD 에 결과가 없어져서, 리뷰 지적을 반영한
# PR 이 영원히 머지되지 않는다. (관리자만 --admin 으로 넘어갈 수 있다)
#
# edited 는 제목을 고쳤을 때 다시 돌리기 위해 필요하다.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-policy:
    name: Validate PR conventions
    runs-on: ubuntu-latest
    # 타임아웃이 없으면 GitHub 기본값 360분이 걸린다. 이 검사는 몇 초면 끝난다.
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate base branch
        shell: bash
        run: |
          if [[ "$BASE_REF" != "main" ]]; then
            echo "::error::Pull request는 main을 대상으로 해야 합니다."
            exit 1
          fi

      - name: Validate branch name
        shell: bash
        run: |
          branch_pattern='^(feat|fix|refactor|docs|test|chore|ci|hotfix)/[a-z0-9]+([a-z0-9-]*[a-z0-9])?$'
          if ! grep -Eq "$branch_pattern" <<<"$HEAD_REF"; then
            echo "::error::브랜치 이름 규칙 위반: $HEAD_REF"
            echo "허용 접두사 + 소문자 kebab-case를 쓰세요. 예: feat/main-page-layout"
            exit 1
          fi

      - name: Validate PR title
        shell: bash
        run: |
          title_pattern='^(feat|fix|refactor|docs|test|chore|ci|build|perf|revert)(\([a-z0-9][a-z0-9-]*\))?!?: .+'
          if ! grep -Eq "$title_pattern" <<<"$PR_TITLE"; then
            echo "::error::PR 제목은 Conventional Commits 형식이어야 합니다."
            echo "예: feat(fe): 메인 페이지 레이아웃 추가"
            exit 1
          fi
