name: Decision
description: 팀이 함께 정해야 하는 기술·설계 결정을 논의합니다. 합의 결과는 docs/adr/ 에 ADR로 남깁니다.
title: "[Decision]: "
labels: ["type:decision"]
body:
  - type: textarea
    id: context
    attributes:
      label: 배경
      description: 어떤 문제나 제약 때문에 결정이 필요한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 검토할 선택지
      description: 각 선택지의 장단점을 함께 적어 주세요.
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: 결정 기한
      description: 3일 일정이므로 언제까지 정해야 하는지 반드시 적습니다.
      placeholder: "1일차 오후 6시"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 이 결정이 막고 있는 작업
      description: 결정이 늦어지면 누가 무엇을 못 하는지 적어 주세요.
    validations:
      required: true
