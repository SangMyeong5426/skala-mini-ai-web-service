  <text x="860" y="104" class="bid">S-01</text><text x="860" y="133" class="bt">홈</text>
  <text x="1640" y="104" class="bid">S-02</text><text x="1640" y="133" class="bt">여행 등록</text>
  <text x="2420" y="104" class="bid">S-03</text><text x="2420" y="133" class="bt">짐 사진 등록</text>

