  <text x="80" y="42" font-size="17" font-weight="800" fill="#303030">짐싸조 · Desktop Web Wireframes</text>
  <text x="80" y="67" font-size="12" fill="#666666">localhost:5173에서 실제 공통 헤더·카드·상태 UI를 확인한 뒤 1440px 데스크톱 화면으로 확장</text>

