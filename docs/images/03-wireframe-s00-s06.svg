    <rect x="790" y="555" width="400" height="64" rx="9" class="btn"/><text x="990" y="595" text-anchor="middle" class="btnt">로그인</text><text x="990" y="670" text-anchor="middle" class="small">처음이신가요? 회원가입</text>
  </svg>

