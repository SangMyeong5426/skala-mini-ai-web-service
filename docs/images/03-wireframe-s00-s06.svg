<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1320" viewBox="0 0 3200 1320" role="img" aria-labelledby="title desc">
  <title id="title">짐싸조 데스크톱 웹 와이어프레임</title>
  <desc id="desc">localhost에서 확인한 공통 헤더와 카드 스타일을 반영한 S-00부터 S-06까지의 데스크톱 웹 화면</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#e5e5e5"/></pattern>
    <style>
      text{font-family:"Apple SD Gothic Neo",Pretendard,sans-serif;fill:#1f1f1f}.bid{font-size:14px;font-weight:800;fill:#303030}.bt{font-size:25px;font-weight:800}.brand{font-size:27px;font-weight:800;fill:#303030}.nav{font-size:17px;fill:#666666}.eye{font-size:18px;fill:#666666}.h1{font-size:39px;font-weight:800}.h2{font-size:25px;font-weight:800}.h3{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:15px;fill:#666666}.tiny{font-size:13px;fill:#666666}.card{fill:#fff;stroke:#d9d9d9;stroke-width:2}.soft{fill:#f7f7f7;stroke:#d9d9d9;stroke-width:2}.as{fill:#e2e2e2;stroke:#b8b8b8;stroke-width:2}.warn{fill:#eeeeee;stroke:#bdbdbd;stroke-width:2}.input{fill:#fff;stroke:#aeaeae;stroke-width:2}.line{stroke:#d9d9d9;stroke-width:2}.btn{fill:#303030}.btnt{fill:#fff;font-size:17px;font-weight:700}.tag{font-size:13px;font-weight:700}.pbg{fill:#e7e7e7}.prog{fill:#303030}.sk{fill:#e9e9e9}
    </style>
