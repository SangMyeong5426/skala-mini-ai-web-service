      <rect width="1440" height="900" rx="8" fill="#f7f7f7" stroke="#cfcfcf" stroke-width="2"/><rect width="1440" height="10" rx="8" fill="#292929"/>
      <rect y="10" width="1440" height="70" fill="#fff" stroke="#d9d9d9" stroke-width="2"/><text x="52" y="56" class="brand">짐싸조</text>
      <text x="190" y="54" class="nav">홈</text><text x="253" y="54" class="nav">내 여행</text><text x="350" y="54" class="nav">이용 안내</text>
