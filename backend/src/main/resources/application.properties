# 값은 전부 .env(환경 변수)에서 읽는다. 코드와 설정에 비밀값을 쓰지 않는다.
# AI-Ready 원칙 4: Security & Config Isolation

spring.application.name=mini-ai-web-service
server.port=${PORT:8080}

# ── 데이터베이스 ──────────────────────────────────────────
# JDBC URL 접두사는 jdbc:postgresql:// 다. Supabase/Neon 대시보드가 주는
# postgresql://USER:PASSWORD@HOST/DB 를 그대로 넣으면 뜨지 않는다.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# 스키마의 주인은 database/schema.sql 이다. 애플리케이션이 테이블을 만들지 않는다.
# 엔터티와 실제 스키마가 어긋나면 기동 시점에 알려 준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── 가상 스레드 (Java 21) ─────────────────────────────────
# AI 호출은 느리다. 실제 LLM 을 붙였을 때 요청 하나가 스레드를 오래 잡아도
# 비용이 낮게 유지된다. Java 21 을 고른 이유다. (ADR 0001)
spring.threads.virtual.enabled=true

# ── CORS ──────────────────────────────────────────────────
# 프런트엔드 개발 서버 주소. 이게 없으면 2일차 FE-BE 연동이 브라우저에서 막힌다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── 사진 업로드 ───────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
# 한 번에 여러 장을 올릴 수 있으므로 요청 한도는 넉넉히 잡는다.
spring.servlet.multipart.max-request-size=30MB

# ── 날씨 (OpenWeather) ────────────────────────────────────
# mock 이면 외부를 호출하지 않고 계절 평균만 돌려준다. 기본값이 mock 인 이유는
# 데모다 — 키가 없거나 네트워크가 끊겨도 화면이 떠야 한다.
#
# 무료 플랜 예보는 5일까지다. 출발일이 그보다 멀면 계절 평균으로 답한다.
app.weather.provider=${WEATHER_PROVIDER:mock}
app.weather.base-url=${WEATHER_API_BASE_URL:https://api.openweathermap.org/data/2.5}
app.weather.api-key=${WEATHER_API_KEY:}
# 이 일수를 넘는 여행은 예보 대신 계절 평균을 쓴다.
app.weather.forecast-max-days=5

# ── AI (지금은 전부 mock) ─────────────────────────────────
app.ai.provider=${AI_PROVIDER:mock}
app.ai.model=${AI_MODEL:mock}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.ai.max-tokens=${AI_MAX_TOKENS:2048}
app.ai.mock-delay-ms=${AI_MOCK_DELAY_MS:0}

# ── Swagger ───────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
