# 값은 전부 .env(환경 변수)에서 읽는다. 코드와 설정에 비밀값을 쓰지 않는다.
# AI-Ready 원칙 4: Security & Config Isolation

spring.application.name=mini-ai-web-service
server.port=${PORT:8080}

# ── 데이터베이스 ──────────────────────────────────────────
# JDBC URL 접두사는 jdbc:postgresql:// 다. Supabase/Neon 대시보드가 주는
# postgresql://USER:PASSWORD@HOST/DB 를 그대로 넣으면 뜨지 않는다.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# 스키마의 주인은 database/schema.sql 이다. 애플리케이션이 테이블을 만들지 않는다.
# 엔터티와 실제 스키마가 어긋나면 기동 시점에 알려 준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── 가상 스레드 (Java 21) ─────────────────────────────────
# AI 호출은 느리다. 실제 LLM 을 붙였을 때 요청 하나가 스레드를 오래 잡아도
# 비용이 낮게 유지된다. Java 21 을 고른 이유다. (ADR 0001)
spring.threads.virtual.enabled=true

# ── CORS ──────────────────────────────────────────────────
# 프런트엔드 개발 서버 주소. 이게 없으면 2일차 FE-BE 연동이 브라우저에서 막힌다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── AI (지금은 전부 mock) ─────────────────────────────────
app.ai.provider=${AI_PROVIDER:mock}
app.ai.model=${AI_MODEL:mock}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.ai.max-tokens=${AI_MAX_TOKENS:2048}
app.ai.mock-delay-ms=${AI_MOCK_DELAY_MS:0}

# ── Swagger ───────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
