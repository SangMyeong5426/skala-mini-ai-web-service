# 값은 전부 .env(환경 변수)에서 읽는다. 코드와 설정에 비밀값을 쓰지 않는다.
# AI-Ready 원칙 4: Security & Config Isolation

spring.application.name=mini-ai-web-service
server.port=${PORT:8080}

# ── 데이터베이스 ──────────────────────────────────────────
# JDBC URL 접두사는 jdbc:postgresql:// 다. Supabase/Neon 대시보드가 주는
# postgresql://USER:PASSWORD@HOST/DB 를 그대로 넣으면 뜨지 않는다.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# 팀 공용 Supabase에 개발 서버마다 과도한 연결을 점유하지 않는다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# 스키마의 주인은 database/schema.sql 이다. 애플리케이션이 테이블을 만들지 않는다.
# 엔터티와 실제 스키마가 어긋나면 기동 시점에 알려 준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 공용 DB에 schema.sql / data.sql을 자동 실행하지 않는다.
spring.sql.init.mode=never

# ── 가상 스레드 (Java 21) ─────────────────────────────────
# AI 호출은 느리다. 실제 LLM 을 붙였을 때 요청 하나가 스레드를 오래 잡아도
# 비용이 낮게 유지된다. Java 21 을 고른 이유다. (ADR 0001)
spring.threads.virtual.enabled=true

# ── CORS ──────────────────────────────────────────────────
# 프런트엔드 개발 서버 주소. 이게 없으면 2일차 FE-BE 연동이 브라우저에서 막힌다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── 사진 업로드 ───────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
# 한 번에 여러 장을 올릴 수 있으므로 요청 한도는 넉넉히 잡는다.
spring.servlet.multipart.max-request-size=30MB

# ── 날씨 (Open-Meteo) ─────────────────────────────────────
# API 키가 없다. 그래서 팀원이 별도 발급 없이 바로 쓸 수 있다.
# mock 이면 외부를 호출하지 않고 계절 평균만 돌려준다.
app.weather.provider=${WEATHER_PROVIDER:openmeteo}

# 도시명 → 좌표. 예보 API 가 좌표만 받으므로 먼저 호출한다. 한국어를 지원한다.
#   ?name=도쿄&count=1&language=ko
app.weather.geocoding-url=https://geocoding-api.open-meteo.com/v1/search

# 단기 예보 — 최대 16일.  ?latitude=&longitude=&daily=&forecast_days=
app.weather.forecast-url=https://api.open-meteo.com/v1/forecast

# 계절 예보 — 최대 7개월(ECMWF SEAS5). 16일을 넘는 여행에 쓴다.
app.weather.seasonal-url=https://seasonal-api.open-meteo.com/v1/seasonal

# 출발일이 오늘로부터 이 일수 이내면 forecast-url, 넘으면 seasonal-url 을 쓴다.
app.weather.forecast-max-days=16

# ── AI (지금은 전부 mock) ─────────────────────────────────
app.ai.provider=${AI_PROVIDER:mock}
app.ai.model=${AI_MODEL:mock}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.ai.max-tokens=${AI_MAX_TOKENS:4096}
app.ai.mock-delay-ms=${AI_MOCK_DELAY_MS:0}
# 프런트엔드에 다음 폴링까지 기다릴 시간을 알려 준다(06). 실제 AI 를 붙이면 이 값만 늘린다.
app.ai.poll-after-ms=${AI_POLL_AFTER_MS:500}

# ── Swagger ───────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
