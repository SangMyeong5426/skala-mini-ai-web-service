# 테스트 전용 덮어쓰기. 파일 이름을 application.properties 로 두면
# src/main/resources/application.properties 를 통째로 "가려서"(shadow)
# main 에 있는 app.cors.* 같은 설정이 테스트에서 사라진다.
# application-<프로필>.properties 로 두고 @ActiveProfiles("test") 를 쓰면
# main 설정이 그대로 살아 있고 아래 값만 덮인다.

# DB 없이도 ./gradlew build 가 통과해야 한다. 인메모리 H2 로 돈다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 실제 스키마는 database/schema.sql 이 만든다. 테스트에서는 엔터티로 만들고 지운다.
spring.jpa.hibernate.ddl-auto=create-drop

# 개발 PC의 CORS 환경 변수와 무관하게 같은 입력으로 검증한다.
app.cors.allowed-origins=http://localhost:5173
