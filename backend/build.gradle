plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '0.0.1-SNAPSHOT'

java {
	// ADR 0001. 팀원이 다른 JDK를 깔았어도 컴파일은 21 기준으로 돈다.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 로그인 필수 결정(docs/01·06)에 따라 서버 세션·CSRF·BCrypt 를 쓴다.
	// 06 이 "Spring Security·HttpSession 을 사용한다" 고 못박았다 — JWT·Redis 는 넣지 않는다.
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Swagger UI(/swagger-ui/index.html)와 OpenAPI 문서(/v3/api-docs)를 자동 생성한다.
	// Boot 4 지원 버전을 사용한다. 근거: https://springdoc.org/
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'

	// 테스트는 인메모리 H2로 돈다. DB가 아직 없어도 ./gradlew build 가 통과해야
	// 팀원이 clone 직후 막히지 않는다. src/test/resources/application-test.properties 참조.
	// (application.properties 라는 이름으로 만들면 main 설정을 통째로 가린다)
	testRuntimeOnly 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ── .env 를 bootRun 에 주입한다 ────────────────────────────────
// 별도 dotenv 라이브러리 없이 Gradle이 KEY=value를 그대로 넘긴다.
// .env가 없으면 OS 환경 변수를 사용한다. 자세한 형식은 SETUP.md 참조.
tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { rawLine ->
			def line = rawLine.trim()
			if (line && !line.startsWith('#') && line.contains('=')) {
				def idx = line.indexOf('=')
				environment line.substring(0, idx).trim(), line.substring(idx + 1).trim()
			}
		}
	}
}
